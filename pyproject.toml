[build-system]
requires = ["setuptools~=83.0.0", "setuptools-scm~=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "swn-sector-generator"
dynamic = ["version"]
description = "Advanced sector generator for the Stars Without Number TTRPG"
readme = "README.md"

requires-python = "~=3.14"

dependencies = [
    "PyYAML~=6.0.3",
]

[project.optional-dependencies]
dev = [
    "git-cliff~=2.13.1",
    "jsonschema~=4.26.0",
    "mypy~=2.3.0",
    "pre-commit~=4.6.1",
    "pydantic~=2.13.4",
    "pymarkdownlnt~=0.9.39",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "ruff~=0.16.1",
    "setuptools-scm~=10.2.1",
    "yamllint~=1.38.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--cov=src/swn_sector_generator",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-vv"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
swn_sector_generator = [
    "resources/**/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/swn_sector_generator/_version.py"
